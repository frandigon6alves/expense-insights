[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "expense-insights"
version = "0.1.0"
description = "Categorize bank-statement CSV exports with your own rules and get a monthly spending report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Franciellen Gonçalves" }]
requires-python = ">=3.12"
dependencies = ["babel>=2.14"]
keywords = ["finance", "csv", "cli", "budget", "i18n"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
expense-insights = "expense_insights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_insights"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "babel.cfg", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=expense_insights --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/expense_insights/__main__.py"]  # exercised in a subprocess by test_cli.py

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0917"]
